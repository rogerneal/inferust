name: Publish to crates.io

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: cargo publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Publish crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::warning::CARGO_REGISTRY_TOKEN is not set; skipping automated publish."
            echo "Add a crates.io API token as the GitHub secret CARGO_REGISTRY_TOKEN to enable this workflow."
            exit 0
          fi
          # Prefer env-var auth; tolerate a prior local publish of the same version
          # so tagging after `cargo publish` does not fail the workflow.
          set +e
          out=$(cargo publish 2>&1)
          status=$?
          set -e
          echo "$out"
          if [ "$status" -eq 0 ]; then
            exit 0
          fi
          if echo "$out" | grep -q 'already exists on crates.io'; then
            echo "::notice::Version already on crates.io; treating publish as success."
            exit 0
          fi
          exit "$status"
