name: Publish to crates.io

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: cargo publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Require crates.io token
        if: secrets.CARGO_REGISTRY_TOKEN == ''
        run: |
          echo "::warning::CARGO_REGISTRY_TOKEN is not set; skipping automated publish."
          echo "Add a crates.io API token as the GitHub secret CARGO_REGISTRY_TOKEN to enable this workflow."

      - name: Publish crate
        if: secrets.CARGO_REGISTRY_TOKEN != ''
        run: cargo publish --token "${{ secrets.CARGO_REGISTRY_TOKEN }}"
